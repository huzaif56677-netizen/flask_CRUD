<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body{
    min-height: 100vh;
    display: flex; 
    justify-content: center; 
    align-items: center;
    background-color: lightblue;
            
    }
form{          
    min-width: 350px;
    width: 30vw;
    height:50vh ;
    background: linear-gradient(135deg, #0f172a, #312e81, #581c87);
    color:white;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    border-radius:1cap;
    padding: 20px;
    margin: 0 auto;
    box-sizing: border-box;
}
button {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #4338ca;
}
input{
    padding: 10px;
}
    </style>
</head>
<body>
    <form method="POST" action="/login">
        <label>Username : </label><input name="username" type="text" required>
        <label>Password : </label><input name="password" type="text" required>
        <button type="submit">submit</button>
     
    </form>
</body>
</html>
