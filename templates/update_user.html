{% extends 'base.html' %}

{% block title %}
Update User
{% endblock %}

{% block content %}


    </style>

<body>

<h1>Update User : ({{user.username}})</h1>

<form method="POST">

    <label>Username</label>
    <input
        type="text"
        name="username"
        value="{{user.username}}"
        required
       
    >

    <label>Email</label>
    <input
        type="email"
        name="email"
        value="{{user.email}}"
        required
        
    >
    <label>Age</label>
    <input
        type="number"
        name="age"
        value="{{ user.age }}"
        required
    >

    <button type="submit">
        Update User
    </button>

</form>

<br>

<a href="{{ url_for('home') }}">
    Back to Home
</a>

{% endblock %}
