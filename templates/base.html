<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Base{% endblock %}</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#eef2f7;
    color:#333;
    min-height:100vh;
}

/* Header */

header{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    text-align:center;
    padding:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

header h1{
    font-size:32px;
    margin-bottom:8px;
}

header p{
    color:#dbeafe;
}

/* Headings */

h1,h2{
    text-align:center;
    margin:30px 0 20px;
    color:#1e293b;
}

/* Tables */

table{
    width:90%;
    margin:25px auto;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

th{
    background:#2563eb;
    color:white;
    padding:15px;
    font-size:16px;
}

td{
    padding:15px;
    border-bottom:1px solid #e5e7eb;
    color:#374151;
}

tr:nth-child(even){
    background:#f8fafc;
}

tr:hover{
    background:#eff6ff;
}

/* Forms */

form{
    width:420px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 5px rgba(37,99,235,.3);
}

/* Buttons */

button,
a{
    display:inline-block;
    text-decoration:none;
    background:#2563eb;
    color:white;
    border:none;
    padding:11px 18px;
    border-radius:6px;
    cursor:pointer;
    transition:.25s;
    font-size:15px;
}
.logout-a{
display:inline-block;
    text-decoration:none;
    background:#2563eb;
    color:white;
    border:none;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    position: absolute;
    right: 20px;
    font-size:15px;
}
.logout-div{
    
    display: flex;
    align-items: flex-end;
}

button:hover,
a:hover{
    background:#1d4ed8;
}

.del-btn{
    background:#dc2626;
}

.del-btn:hover{
    background:#b91c1c;
}

.filter-btn{
    background:#059669;
}

.filter-btn:hover{
    background:#047857;
}

/* Update/Delete Buttons */

.two-buttons-div{
    display:flex;
    gap:10px;
    justify-content:center;
    align-items:center;
}

/* Delete Form */

.two-buttons-div form{
    margin:0;
    padding:0;
    width:auto;
    background:none;
    box-shadow:none;
}

/* Standalone Links */

a{
    margin:20px auto;
}

/* Footer */

footer{
    margin-top:50px;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:18px;
}

/* Responsive */

@media(max-width:900px){

    table{
        width:98%;
        font-size:14px;
    }

    form{
        width:95%;
    }

    .two-buttons-div{
        flex-direction:column;
    }
}
.add_user-a{
    margin-left: 100px;
}
.filter-btn-wrapper {
    display: flex;
    justify-content: center;
}

    </style>
</head>
<body>
    <header>
        <h1 style="color: white;">User Information</h1>
        <p>Welcome back!</p>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
    © 2026 My Website. All rights reserved.
</footer>
</body>
</html>
