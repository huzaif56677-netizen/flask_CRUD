{% extends 'base.html' %}

{% block title %}
Add User
{% endblock %}

{% block content %}


<h1>Add User</h1>

<form method="POST">

    <label>Username</label>
    <input
        type="text"
        name="username"
        required
    >

    <label>Email</label>
    <input
        type="email"
        name="email"
        required
    >
    <label>Age</label>
    <input
        type="number"
        name="age"
        required
    >

    <button type="submit">
        Add User
    </button>

</form>

<br>

<a href="{{ url_for('home') }}">
    Back to Home
</a>

{% endblock %}
